<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Usuarios — Admin Treehouse1959</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=DM+Sans:wght@300;400;500;700&display=swap" rel="stylesheet" />
	
  <link rel="icon" type="image/x-icon" href="/favicon.ico">
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
  <link rel="manifest" href="/site.webmanifest">
  <meta name="theme-color" content="#ffffff">
	
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --verde-profundo: #1a3a2a;
      --verde-musgo:    #2d5a3d;
      --verde-selva:    #3d7a52;
      --tierra:         #8b6242;
      --arena:          #f0e8d8;
      --crema:          #faf7f2;
      --dorado:         #c9a84c;
      --dorado-claro:   #e8c97a;
      --blanco:         #ffffff;
      --texto-oscuro:   #1c2b20;
      --texto-medio:    #4a5e50;
      --sidebar-w:      260px;
      --apple-bg:       #f5f5f7;
      --apple-card:     rgba(255, 255, 255, 0.8);
      --apple-radius:   20px;
    }
    body { font-family: 'DM Sans', -apple-system, sans-serif; background: var(--apple-bg); color: var(--texto-oscuro); display: flex; min-height: 100vh; }

    /* ── SIDEBAR (Modern Apple Style - Dark Version) ── */
    .sidebar {
      width: var(--sidebar-w);
      background: var(--verde-profundo);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      position: fixed;
      top: 0; left: 0; bottom: 0;
      z-index: 50;
    }
    .sidebar-logo {
      padding: 2.5rem 1.8rem 1.5rem;
      border-bottom: 1px solid rgba(255,255,255,0.05);
    }
    .sidebar-logo h2 {
      font-family: 'Playfair Display', serif;
      font-size: 1.4rem;
      color: var(--blanco);
      font-weight: 700;
    }
    .sidebar-logo h2 span { color: var(--dorado); font-style: italic; }
    .sidebar-logo p { 
      font-size: 0.65rem; 
      color: rgba(255,255,255,0.4); 
      text-transform: uppercase; 
      letter-spacing: 0.15em; 
      margin-top: 0.4rem;
      font-weight: 600;
    }

    .sidebar-nav { flex: 1; padding: 1.5rem 0.8rem; }
    .nav-seccion {
      font-size: 0.7rem;
      color: rgba(255,255,255,0.3);
      text-transform: uppercase;
      letter-spacing: 0.1em;
      padding: 1.5rem 1rem 0.6rem;
      font-weight: 700;
    }
    .nav-link {
      display: flex;
      align-items: center;
      gap: 0.8rem;
      padding: 0.8rem 1rem;
      color: rgba(255,255,255,0.7);
      text-decoration: none;
      font-size: 0.95rem;
      font-weight: 500;
      transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
      border-radius: 12px;
      margin-bottom: 0.2rem;
    }
    .nav-link:hover { background: rgba(255,255,255,0.05); color: var(--blanco); }
    .nav-link.activo { 
      background: var(--dorado); 
      color: var(--verde-profundo);
      box-shadow: 0 10px 20px rgba(0,0,0,0.1);
    }
    .nav-link svg { width: 18px; height: 18px; transition: stroke 0.2s; }
    .nav-link.activo svg { stroke: var(--verde-profundo); }

    .sidebar-footer {
      padding: 1.5rem;
      border-top: 1px solid rgba(255,255,255,0.05);
    }
    .sidebar-usuario { font-size: 0.82rem; color: rgba(255,255,255,0.4); margin-bottom: 1rem; }
    .sidebar-usuario strong { display: block; color: var(--blanco); font-size: 0.95rem; margin-bottom: 0.2rem; }
    .btn-salir {
      width: 100%;
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.1);
      color: var(--blanco);
      padding: 0.7rem;
      border-radius: 12px;
      font-family: inherit;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }
    .btn-salir:hover { background: rgba(200,0,0,0.05); color: #ff6b6b; border-color: rgba(200,0,0,0.1); }

    /* ── MAIN CONTENT ── */
    .main { margin-left: var(--sidebar-w); flex: 1; display: flex; flex-direction: column; }
    .topbar {
      padding: 1.5rem 3rem; display: flex; align-items: center; justify-content: space-between;
      position: sticky; top: 0; z-index: 40; background: rgba(245, 245, 247, 0.8); backdrop-filter: blur(20px);
    }
    .topbar-titulo { font-size: 1.8rem; font-weight: 700; color: var(--texto-oscuro); }
    .contenido { padding: 0 3rem 3rem; }

    /* ── TABLA MODERNA ── */
    .tabla-wrap {
      background: var(--blanco);
      border-radius: var(--apple-radius);
      box-shadow: 0 4px 24px rgba(0,0,0,0.03);
      border: 1px solid rgba(0,0,0,0.02);
      overflow: hidden;
    }
    .tabla-header {
      padding: 1.5rem 2rem;
      border-bottom: 1px solid rgba(0,0,0,0.03);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .tabla-titulo { font-weight: 700; font-size: 1.1rem; color: var(--texto-oscuro); }
    
    table { width: 100%; border-collapse: collapse; }
    thead th { padding: 1rem 1.5rem; text-align: left; font-size: 0.72rem; font-weight: 700; color: var(--texto-medio); text-transform: uppercase; letter-spacing: 0.1em; opacity: 0.6; }
    tbody tr { border-bottom: 1px solid rgba(0,0,0,0.03); transition: background 0.15s; }
    tbody tr:hover { background: var(--apple-bg); }
    tbody td { padding: 1.2rem 1.5rem; font-size: 0.92rem; color: var(--texto-oscuro); }

    .user-info-cell { display: flex; align-items: center; gap: 1rem; }
    .user-avatar-small { 
      width: 36px; height: 36px; background: var(--verde-musgo); color: white;
      border-radius: 50%; display: flex; align-items: center; justify-content: center;
      font-size: 0.9rem; font-weight: 700;
    }

    .rol-badge { padding: 0.3rem 0.8rem; border-radius: 20px; font-size: 0.7rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; }
    .rol-admin { background: rgba(201,168,76,0.15); color: var(--tierra); }
    .rol-recep { background: rgba(61,122,82,0.1); color: var(--verde-selva); }
    
    .status-badge { display: inline-flex; align-items: center; gap: 0.4rem; font-size: 0.75rem; font-weight: 600; }
    .status-active { color: #218c49; }
    .status-inactive { color: #b02a2a; }

    .btn-apple { 
      background: var(--verde-profundo); color: white; border: none; padding: 0.7rem 1.4rem; border-radius: 12px; 
      font-weight: 600; cursor: pointer; transition: all 0.2s; display: inline-flex; align-items: center; gap: 0.5rem;
    }
    .btn-apple.gold { background: var(--dorado); color: var(--verde-profundo); }

    /* ── MODAL STYLES ── */
    .modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.5);
      backdrop-filter: blur(5px);
      z-index: 1000;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }
    .modal.visible { display: flex; }
    .modal-content {
      background: var(--blanco);
      padding: 2.5rem;
      border-radius: var(--apple-radius);
      width: 100%;
      max-width: 500px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.2);
      position: relative;
    }
    .modal-header { margin-bottom: 2rem; }
    .modal-titulo { font-family: 'Playfair Display', serif; font-size: 1.6rem; color: var(--verde-profundo); font-weight: 700; }
    
    .form-group { margin-bottom: 1.2rem; }
    .form-group label { display: block; font-size: 0.7rem; font-weight: 700; color: var(--texto-medio); text-transform: uppercase; margin-bottom: 0.5rem; letter-spacing: 0.05em; }
    .form-group input, .form-group select, .form-group textarea {
      width: 100%; padding: 0.8rem 1rem; border-radius: 12px; border: 1px solid rgba(0,0,0,0.1); outline: none; font-family: inherit; font-size: 0.95rem; transition: border-color 0.2s;
    }
    .form-group input:focus { border-color: var(--dorado); }
    
    .modal-footer { margin-top: 2.5rem; display: flex; gap: 1rem; justify-content: flex-end; }
    .btn-cancelar { background: rgba(0,0,0,0.05); color: var(--texto-oscuro); border: none; padding: 0.7rem 1.5rem; border-radius: 12px; font-weight: 600; cursor: pointer; }

    /* Icons */
    svg { fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  </style>
</head>
<body>

<aside class="sidebar">
  <div class="sidebar-logo">
    <h2>Treehouse<span>1959</span></h2>
    <p>Control de Mando</p>
  </div>
  <nav class="sidebar-nav">
    <div class="nav-seccion">Principal</div>
    <a href="dashboard.html" class="nav-link">
      <svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7"></rect><rect x="14" y="3" width="7" height="7"></rect><rect x="14" y="14" width="7" height="7"></rect><rect x="3" y="14" width="7" height="7"></rect></svg>
      Dashboard
    </a>
    <a href="reservas.html" class="nav-link">
      <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg>
      Reservas
    </a>
    <div class="nav-seccion">Gestión</div>
    <a href="habitaciones.html" class="nav-link">
      <svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 22"></polyline></svg>
      Habitaciones
    </a>
    <a href="productos.html" class="nav-link">
      <svg viewBox="0 0 24 24"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"></path><polyline points="3.27 6.96 12 12.01 20.73 6.96"></polyline><line x1="12" y1="22.08" x2="12" y2="12"></line></svg>
      Productos
    </a>
    <a href="usuarios.html" class="nav-link activo">
      <svg viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M23 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></svg>
      Usuarios
    </a>
  </nav>
  <div class="sidebar-footer">
    <div class="sidebar-usuario">
      <strong id="sidebarNombre">Cargando...</strong>
      Administrador
    </div>
    <button class="btn-salir" onclick="cerrarSesion()">Cerrar sesión</button>
  </div>
</aside>

<div class="main">
  <div class="topbar">
    <span class="topbar-titulo">Equipo</span>
    <button class="btn-apple gold" onclick="abrirModal()">
      <svg style="width:16px;height:16px" viewBox="0 0 24 24"><path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="8.5" cy="7" r="4"></circle><line x1="20" y1="8" x2="20" y2="14"></line><line x1="23" y1="11" x2="17" y2="11"></line></svg>
      Añadir Miembro
    </button>
  </div>

  <div class="contenido">
    <div class="tabla-wrap">
      <div class="tabla-header">
        <span class="tabla-titulo">Miembros del Sistema</span>
        <span id="contador" class="contador-badge">0 usuarios</span>
      </div>
      <div style="overflow-x:auto">
        <table>
          <thead>
            <tr>
              <th>Nombre y Usuario</th>
              <th>Rol</th>
              <th>Estado</th>
              <th>Acciones</th>
            </tr>
          </thead>
          <tbody id="cuerpoTabla">
            <!-- Cargado por JS -->
          </tbody>
        </table>
      </div>
    </div>
  </div>
</div>

<!-- ── MODAL: AÑADIR / EDITAR USUARIO ── -->
<div id="modalUsuario" class="modal">
  <div class="modal-content">
    <div class="modal-header">
      <h3 id="modalTitulo" class="modal-titulo">Nuevo Miembro</h3>
    </div>
    <div class="modal-body">
      <input type="hidden" id="userId" />
      <div class="form-group">
        <label>Nombre Completo</label>
        <input type="text" id="userNombre" placeholder="Ej: Juan Pérez" />
      </div>
      <div class="form-group">
        <label>Correo Electrónico</label>
        <input type="email" id="userEmail" placeholder="juan@treehouse.com" />
      </div>
      <div class="form-group" id="passGroup">
        <label>Contraseña</label>
        <input type="password" id="userPass" placeholder="Mínimo 6 caracteres" />
      </div>
      <div style="display:grid; grid-template-columns: 1fr 1fr; gap:1rem">
        <div class="form-group">
          <label>Rol</label>
          <select id="userRol">
            <option value="admin">Administrador</option>
            <option value="recepcion">Recepcionista</option>
          </select>
        </div>
        <div class="form-group">
          <label>Estado</label>
          <select id="userActivo">
            <option value="1">Activo</option>
            <option value="0">Inactivo</option>
          </select>
        </div>
      </div>
      <div class="form-group" id="editPassGroup" style="display:none">
        <label>Nueva Contraseña</label>
        <input type="password" id="edit-password" placeholder="Nueva contraseña (dejar en blanco para no cambiar)" />
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn-cancelar" onclick="cerrarModal()">Cancelar</button>
      <button class="btn-apple" onclick="guardarUsuario()">Guardar Cambios</button>
    </div>
  </div>
</div>

<script>
  const usuario = JSON.parse(sessionStorage.getItem('usuario') || 'null');
  if (!usuario || usuario.rol !== 'admin') {
    window.location.href = '../login.html';
  } else {
    document.getElementById('sidebarNombre').textContent = usuario.nombre;
  }

  let todosUsuarios = [];

  async function cargar() {
    try {
      const res = await fetch('/api/admin/usuarios');
      const data = await res.json();
      todosUsuarios = data.data || [];
      renderTabla(todosUsuarios);
    } catch(e) { console.error(e); }
  }

  function renderTabla(lista) {
    document.getElementById('contador').textContent = lista.length + ' usuarios';
    const cuerpo = document.getElementById('cuerpoTabla');
    cuerpo.innerHTML = lista.map(u => `
      <tr>
        <td>
          <div class="user-info-cell">
            <div class="user-avatar-small">${u.nombre.charAt(0).toUpperCase()}</div>
            <div>
              <div style="font-weight:700">${u.nombre}</div>
              <div style="font-size:0.75rem;opacity:0.6">${u.email}</div>
            </div>
          </div>
        </td>
        <td>
          <span class="rol-badge ${u.rol === 'admin' ? 'rol-admin' : 'rol-recep'}">${u.rol}</span>
        </td>
        <td>
          <span class="status-badge ${u.activo ? 'status-active' : 'status-inactive'}">
            ${u.activo ? '● Activo' : '○ Inactivo'}
          </span>
        </td>
        <td>
          <button class="btn-apple" onclick="abrirModal(${u.id})" style="padding:0.4rem 0.8rem; font-size:0.8rem">Gestionar</button>
        </td>
      </tr>
    `).join('');
  }

  // ── LÓGICA MODAL ──
  function abrirModal(id = null) {
    const modal = document.getElementById('modalUsuario');
    const titulo = document.getElementById('modalTitulo');
    const passGroup = document.getElementById('passGroup');
    const editPassGroup = document.getElementById('editPassGroup');
    
    if (id) {
      const u = todosUsuarios.find(user => user.id == id);
      titulo.textContent = 'Editar Miembro';
      passGroup.style.display = 'none'; // No se edita la pass desde aquí por seguridad
      editPassGroup.style.display = 'block';
      document.getElementById('edit-password').value = '';
      document.getElementById('userId').value     = u.id;
      document.getElementById('userNombre').value = u.nombre;
      document.getElementById('userEmail').value  = u.email;
      document.getElementById('userRol').value    = u.rol;
      document.getElementById('userActivo').value = u.activo ? "1" : "0";
    } else {
      titulo.textContent = 'Nuevo Miembro';
      passGroup.style.display = 'block';
      editPassGroup.style.display = 'none';
      document.getElementById('userId').value     = "";
      document.getElementById('userNombre').value = "";
      document.getElementById('userEmail').value  = "";
      document.getElementById('userPass').value   = "";
      document.getElementById('userRol').value    = "recepcion";
      document.getElementById('userActivo').value = "1";
    }
    modal.classList.add('visible');
  }

  function cerrarModal() {
    document.getElementById('modalUsuario').classList.remove('visible');
  }

  async function guardarUsuario() {
    const id = document.getElementById('userId').value;
    const datos = {
      nombre: document.getElementById('userNombre').value,
      email:  document.getElementById('userEmail').value,
      rol:    document.getElementById('userRol').value,
      activo: document.getElementById('userActivo').value === "1"
    };

    if (id) {
      const newPass = document.getElementById('edit-password').value;
      if (newPass) datos.password = newPass;
    } else {
      datos.password = document.getElementById('userPass').value;
      if (!datos.password) return alert('La contraseña es obligatoria para nuevos usuarios');
    }

    if (!datos.nombre || !datos.email) return alert('Nombre y Email son obligatorios');

    try {
      const url    = id ? `/api/admin/usuarios/${id}` : '/api/admin/usuarios';
      const method = id ? 'PUT' : 'POST';
      
      const res = await fetch(url, {
        method,
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(datos)
      });
      
      const data = await res.json();
      if (data.ok) {
        cerrarModal();
        cargar();
      } else {
        alert('Error al guardar: ' + data.mensaje);
      }
    } catch (e) { console.error(e); }
  }

  function cerrarSesion() { sessionStorage.removeItem('usuario'); window.location.href = '../login.html'; }
  cargar();
</script>
</body>
</html>
