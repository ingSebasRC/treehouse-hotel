<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Factura — Treehouse1959</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=DM+Sans:wght@300;400;500;700&display=swap" rel="stylesheet" />
	
  <link rel="icon" type="image/x-icon" href="/favicon.ico">
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
  <link rel="manifest" href="/site.webmanifest">
  <meta name="theme-color" content="#ffffff">
	
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --verde-profundo: #1a3a2a;
      --verde-musgo:    #2d5a3d;
      --verde-selva:    #3d7a52;
      --tierra:         #8b6242;
      --arena:          #f0e8d8;
      --crema:          #faf7f2;
      --dorado:         #c9a84c;
      --dorado-claro:   #e8c97a;
      --blanco:         #ffffff;
      --texto-oscuro:   #1c2b20;
      --texto-medio:    #4a5e50;
      --sidebar-w:      260px;
      --apple-bg:       #f5f5f7;
      --apple-card:     rgba(255, 255, 255, 0.8);
      --apple-radius:   20px;
    }
    body { 
      font-family: 'DM Sans', -apple-system, sans-serif; 
      background: var(--apple-bg); 
      color: var(--texto-oscuro); 
      display: flex; 
      min-height: 100vh;
      letter-spacing: -0.01em;
    }

    /* ── SIDEBAR (Dark Version) ── */
    .sidebar {
      width: var(--sidebar-w);
      background: var(--verde-profundo);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      position: fixed;
      top: 0; left: 0; bottom: 0;
      z-index: 50;
    }
    .sidebar-logo { padding: 2.5rem 1.8rem 1.5rem; border-bottom: 1px solid rgba(255,255,255,0.05); }
    .sidebar-logo h2 { font-family: 'Playfair Display', serif; font-size: 1.4rem; color: var(--blanco); font-weight: 700; }
    .sidebar-logo h2 span { color: var(--dorado); font-style: italic; }
    .sidebar-logo p { font-size: 0.65rem; color: rgba(255,255,255,0.4); text-transform: uppercase; letter-spacing: 0.15em; margin-top: 0.4rem; font-weight: 600; }
    .sidebar-nav { flex: 1; padding: 1.5rem 0.8rem; }
    .nav-seccion { font-size: 0.7rem; color: rgba(255,255,255,0.3); text-transform: uppercase; letter-spacing: 0.1em; padding: 1.5rem 1rem 0.6rem; font-weight: 700; }
    .nav-link { display: flex; align-items: center; gap: 0.8rem; padding: 0.8rem 1rem; color: rgba(255,255,255,0.7); text-decoration: none; font-size: 0.95rem; font-weight: 500; transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1); border-radius: 12px; margin-bottom: 0.2rem; }
    .nav-link:hover { background: rgba(255,255,255,0.05); color: var(--blanco); }
    .nav-link.activo { background: var(--dorado); color: var(--verde-profundo); box-shadow: 0 10px 20px rgba(0,0,0,0.1); }
    .nav-link svg { width: 18px; height: 18px; }
    .nav-link.activo svg { stroke: var(--verde-profundo); }
    .sidebar-footer { padding: 1.5rem; border-top: 1px solid rgba(255,255,255,0.05); }
    .sidebar-usuario { font-size: 0.82rem; color: rgba(255,255,255,0.4); margin-bottom: 1rem; }
    .sidebar-usuario strong { display: block; color: var(--blanco); font-size: 0.95rem; margin-bottom: 0.2rem; }
    .btn-salir { width: 100%; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); color: var(--blanco); padding: 0.7rem; border-radius: 12px; font-weight: 600; cursor: pointer; }

    /* ── MAIN ── */
    .main { margin-left: var(--sidebar-w); flex: 1; display: flex; flex-direction: column; }
    .topbar {
      padding: 1.5rem 3rem; display: flex; align-items: center; justify-content: space-between;
      position: sticky; top: 0; z-index: 40; background: rgba(245, 245, 247, 0.8); backdrop-filter: blur(20px);
    }
    .topbar-titulo { font-size: 1.8rem; font-weight: 700; color: var(--texto-oscuro); letter-spacing: -0.02em; }
    .contenido { padding: 0 3rem 3rem; display: flex; justify-content: center; }

    /* ── FACTURA PROFESSIONAL ── */
    .panel-factura {
      background: var(--blanco);
      border-radius: var(--apple-radius);
      box-shadow: 0 10px 40px rgba(0,0,0,0.04);
      border: 1px solid rgba(0,0,0,0.02);
      width: 100%;
      max-width: 850px;
      padding: 4rem;
      margin-top: 2rem;
      position: relative;
    }

    .fac-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 3.5rem; padding-bottom: 2rem; border-bottom: 2px solid var(--arena); }
    .fac-logo h1 { font-family: 'Playfair Display', serif; font-size: 2.2rem; color: var(--verde-profundo); }
    .fac-logo h1 span { color: var(--dorado); font-style: italic; }
    .fac-logo p { font-size: 0.85rem; color: var(--texto-medio); line-height: 1.5; margin-top: 0.4rem; }
    
    .fac-info { text-align: right; }
    .fac-num { font-size: 1.5rem; font-weight: 700; color: var(--verde-profundo); }
    .fac-fecha { font-size: 0.9rem; color: var(--texto-medio); margin-top: 0.3rem; }
    .fac-estado { display: inline-block; background: #e8f5e9; color: #2e7d32; font-size: 0.75rem; font-weight: 700; padding: 0.4rem 1rem; border-radius: 2rem; margin-top: 0.8rem; text-transform: uppercase; letter-spacing: 0.05em; }

    .fac-datos-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 3rem; margin-bottom: 3.5rem; }
    .fac-bloque h3 { font-size: 0.75rem; color: var(--texto-medio); text-transform: uppercase; letter-spacing: 0.12em; margin-bottom: 1rem; font-weight: 700; border-bottom: 1px solid var(--arena); padding-bottom: 0.5rem; }
    .fac-bloque p { font-size: 1rem; color: var(--texto-oscuro); line-height: 1.8; }
    .fac-bloque p strong { color: var(--verde-profundo); font-weight: 700; }

    .fac-tabla { width: 100%; border-collapse: collapse; margin-bottom: 2.5rem; }
    .fac-tabla thead th { background: var(--verde-profundo); color: var(--blanco); padding: 1rem 1.2rem; text-align: left; font-size: 0.8rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; }
    .fac-tabla thead th:last-child { text-align: right; border-radius: 0 12px 12px 0; }
    .fac-tabla thead th:first-child { border-radius: 12px 0 0 12px; }
    
    .fac-tabla tbody tr { border-bottom: 1px solid rgba(0,0,0,0.04); }
    .fac-tabla tbody td { padding: 1.2rem; font-size: 0.95rem; color: var(--texto-oscuro); }
    .fac-tabla tbody td:last-child { text-align: right; font-weight: 700; }
    
    .fac-tabla tfoot td { padding: 0.8rem 1.2rem; font-size: 0.95rem; }
    .fac-tabla tfoot tr.total td { font-size: 1.4rem; font-weight: 800; color: var(--verde-profundo); padding-top: 1.5rem; }
    .fac-tabla tfoot td:last-child { text-align: right; }

    .fac-pie { display: flex; justify-content: space-between; align-items: flex-end; margin-top: 4rem; padding-top: 2rem; border-top: 1px solid var(--arena); }
    .fac-pie-txt { font-size: 0.85rem; color: var(--texto-medio); line-height: 1.6; max-width: 60%; }
    .fac-firma { text-align: center; }
    .fac-firma-linea { width: 180px; border-top: 1px solid var(--texto-medio); margin-bottom: 0.5rem; }
    .fac-firma p { font-size: 0.8rem; color: var(--texto-medio); font-weight: 500; }

    /* Botones Apple Style */
    .btn-apple { 
      background: var(--verde-profundo); color: white; border: none; padding: 0.7rem 1.5rem; border-radius: 12px; 
      font-weight: 600; cursor: pointer; transition: all 0.2s; display: inline-flex; align-items: center; gap: 0.6rem; font-family: inherit;
    }
    .btn-apple.gold { background: var(--dorado); color: var(--verde-profundo); }
    .btn-apple:hover { transform: translateY(-2px); box-shadow: 0 5px 15px rgba(0,0,0,0.1); }

    svg { fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

    @media print {
      body { background: white; }
      .sidebar, .topbar, .no-imprimir { display: none !important; }
      .main { margin-left: 0; }
      .contenido { padding: 0; }
      .panel-factura { box-shadow: none; border: none; max-width: 100%; padding: 0; margin: 0; }
    }
  </style>
</head>
<body>

<aside class="sidebar no-imprimir">
  <div class="sidebar-logo">
    <h2>Treehouse<span>1959</span></h2>
    <p>Recepción</p>
  </div>
  <div class="sidebar-nav">
    <div class="nav-seccion">Principal</div>
    <a href="dashboard.html" class="nav-link">
      <svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7"></rect><rect x="14" y="3" width="7" height="7"></rect><rect x="14" y="14" width="7" height="7"></rect><rect x="3" y="14" width="7" height="7"></rect></svg>
      Dashboard
    </a>
    <a id="navHuesped" href="huesped.html" class="nav-link">
      <svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
      Huésped / Consumos
    </a>
  </div>
  <div class="sidebar-footer">
    <div class="sidebar-usuario"><strong id="sidebarNombre">—</strong>Recepcionista</div>
    <button class="btn-salir" onclick="cerrarSesion()">Cerrar sesión</button>
  </div>
</aside>

<div class="main">
  <div class="topbar no-imprimir">
    <div style="display:flex;align-items:center;gap:1.5rem">
      <a id="btnVolver" href="huesped.html" style="text-decoration:none;color:var(--texto-medio);font-size:1.2rem">←</a>
      <span class="topbar-titulo">Generar Factura</span>
    </div>
    <button class="btn-apple gold" onclick="window.print()">
      <svg width="18" height="18" viewBox="0 0 24 24"><path d="M6 9V2h12v7"></path><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"></path><rect x="6" y="14" width="12" height="8"></rect></svg>
      Imprimir Factura
    </button>
  </div>

  <div class="contenido">
    <div class="panel-factura" id="facturaRender">
      <div style="text-align:center; padding:5rem; opacity:0.5">⏳ Procesando factura...</div>
    </div>
  </div>
</div>

<script>
  const usuario = JSON.parse(sessionStorage.getItem('usuario') || 'null');
  if (!usuario) window.location.href = '../login.html';
  else document.getElementById('sidebarNombre').textContent = usuario.nombre;

  const params    = new URLSearchParams(window.location.search);
  const reservaId = params.get('id');
  if (!reservaId) window.location.href = 'dashboard.html';

  // Actualizar enlaces de navegación
  document.getElementById('btnVolver').href = 'huesped.html?id=' + reservaId;
  document.getElementById('navHuesped').href = 'huesped.html?id=' + reservaId;

  function pesos(n) { return '$' + Number(n).toLocaleString('en-US'); }
  function fmt(iso) { return iso ? new Date(iso).toLocaleDateString('es-CO', { day:'2-digit', month:'long', year:'numeric' }) : '—'; }

  async function cargarFactura() {
    try {
      // 1. Obtener datos de reserva, consumos y habitaciones
      const [resData, habsData] = await Promise.all([
        fetch('/api/recepcion/reserva/' + reservaId).then(r => r.json()),
        fetch('/api/habitaciones').then(r => r.json())
      ]);

      if (!resData.ok) throw new Error('Reserva no encontrada');

      const { reserva, consumos } = resData;
      const habs = habsData.data || [];
      const infoHab = habs.find(h => h.id === reserva.habitacion_id) || { 
        precio_1p: 0, iva_1p: 0, valor_1p: 0, 
        precio_2p: 0, iva_2p: 0, valor_2p: 0 
      };

      // 1. Selección de valores según cantidad de adultos
      const esIndividual = Number(reserva.num_adultos) === 1;
      const precioBase   = esIndividual ? Number(infoHab.precio_1p) : Number(infoHab.precio_2p);
      const ivaUnitario  = esIndividual ? Number(infoHab.iva_1p)    : Number(infoHab.iva_2p);
      const valorNoche   = esIndividual ? Number(infoHab.valor_1p)  : Number(infoHab.valor_2p);

      // Calcular noches y total de reserva
      const f1 = new Date(reserva.fecha_checkin);
      const f2 = new Date(reserva.fecha_checkout);
      const noches = Math.round((f2 - f1) / (1000 * 60 * 60 * 24)) || 1;
      const totalReserva = valorNoche * noches;

      // 2. Registrar/Actualizar factura en BD
      const resFac = await fetch('/api/recepcion/factura', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          reserva_id: reservaId,
          total_reserva: totalReserva,
          usuario_id: usuario.id
        })
      });
      const facData = await resFac.json();

      const totalConsumos = consumos.reduce((s, c) => s + Number(c.subtotal), 0);
      const totalFinal    = totalConsumos + totalReserva;

      // 3. Renderizar
      document.getElementById('facturaRender').innerHTML = `
        <div class="fac-header">
          <div class="fac-logo">
            <h1>Treehouse<span>1959</span></h1>
            <p>Hotel Boutique 4★ · Villavicencio, Colombia</p>
            <p>Calle Ficticia 123, Villavicencio · NIT 000.000.000-0</p>
          </div>
          <div class="fac-info">
            <div class="fac-num">FACTURA #${facData.factura_id || reservaId}</div>
            <div class="fac-fecha">${fmt(new Date())}</div>
            <div class="fac-fecha" style="font-weight:600">Reserva ID: ${reservaId}</div>
            <span class="fac-estado">Estado: Confirmada</span>
          </div>
        </div>

        <div class="fac-datos-grid">
          <div class="fac-bloque">
            <h3>Facturado a</h3>
            <p>
              <strong>${reserva.nombre} ${reserva.apellidos}</strong><br>
              ID: ${reserva.documento_tipo || ''} ${reserva.documento_num || '—'}<br>
              ${reserva.email}<br>
              ${reserva.telefono}
            </p>
          </div>
          <div class="fac-bloque">
            <h3>Detalle de Estadía</h3>
            <p>
              <strong>Habitación:</strong> ${reserva.habitacion}<br>
              <strong>Check-in:</strong> ${fmt(reserva.fecha_checkin)}<br>
              <strong>Check-out:</strong> ${fmt(reserva.fecha_checkout)}<br>
              <strong>Huéspedes:</strong> ${reserva.num_adultos} Adulto(s) ${reserva.num_ninos > 0 ? ', ' + reserva.num_ninos + ' Niño(s)' : ''}
            </p>
          </div>
        </div>

        <table class="fac-tabla">
          <thead>
            <tr>
              <th style="width:35%">Concepto / Producto</th>
              <th style="text-align:center; width:10%">Cant.</th>
              <th style="text-align:right; width:18%">Unitario</th>
              <th style="text-align:right; width:15%">IVA</th>
              <th style="text-align:right; width:22%">Subtotal</th>
            </tr>
          </thead>
          <tbody>
            <!-- Fila Principal: Estadía -->
            <tr>
              <td>
                <div style="font-weight:600">Estadía - ${reserva.habitacion} (${noches} noches)</div>
                <div style="font-size:0.75rem; opacity:0.6">Servicio de Alojamiento</div>
              </td>
              <td style="text-align:center">${noches}</td>
              <td style="text-align:right">${pesos(precioBase)}</td>
              <td style="text-align:right">${pesos(ivaUnitario)}</td>
              <td>${pesos(totalReserva)}</td>
            </tr>
            
            <!-- Filas de Consumos -->
            ${consumos.map(c => `
              <tr>
                <td>
                  <div style="font-weight:600">${c.producto_nombre}</div>
                  <div style="font-size:0.75rem; opacity:0.6">${c.categoria}</div>
                </td>
                <td style="text-align:center">${c.cantidad}</td>
                <td style="text-align:right">${pesos(c.precio_unit)}</td>
                <td style="text-align:right; opacity:0.3">—</td>
                <td>${pesos(c.subtotal)}</td>
              </tr>
            `).join('')}
          </tbody>
          <tfoot>
            <tr>
              <td colspan="4" style="text-align:right; color:var(--texto-medio)">Consumos Totales</td>
              <td>${pesos(totalConsumos)}</td>
            </tr>
            <tr class="total">
              <td colspan="4" style="text-align:right">TOTAL A PAGAR</td>
              <td>${pesos(totalFinal)}</td>
            </tr>
          </tfoot>
        </table>

        <div class="fac-pie">
          <div class="fac-pie-txt">
            <p><strong>Notas:</strong> Esta es una factura oficial de servicios hoteleros.</p>
            <p>Gracias por elegir Treehouse 1959. Esperamos que su estancia haya sido placentera.</p>
          </div>
          <div class="fac-firma">
            <div class="fac-firma-linea"></div>
            <p>Firma Autorizada</p>
            <p>${usuario.nombre}</p>
          </div>
        </div>
      `;

    } catch (e) {
      document.getElementById('facturaRender').innerHTML = `<div style="padding:5rem; text-align:center; color:#e63232">❌ Error: ${e.message}</div>`;
    }
  }

  function cerrarSesion() { sessionStorage.removeItem('usuario'); window.location.href = '../login.html'; }
  cargarFactura();
</script>
</body>
</html>
